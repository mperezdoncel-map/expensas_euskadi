<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Control de Expensas - BARRIO EUSKADI I - POCITO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Estilos de optimización absoluta para Impresión y Reportes PDF Selectivos */
        @media print {
            body { background-color: #ffffff; color: #000000; font-size: 11px; }
            header, .no-print, #statusConnection, button, .section-graficos, .mes-corriente-container, #ficha-registros-listados, .tabs-selector-container, .resumen-actions-container { 
                display: none !important; 
            }
            main { max-width: 100% !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .section-metrics { display: block !important; margin-bottom: 20px !important; }
            .metrics-grid { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 16px !important; }
            section { border: 1px solid #cbd5e1 !important; box-shadow: none !important; page-break-inside: avoid; }
            .tabla-container { display: block !important; width: 100% !important; margin-top: 20px !important; }
            table { width: 100% !important; border-collapse: collapse !important; }
            th, td { padding: 6px 8px !important; border-bottom: 1px solid #e2e8f0 !important; }
            .tfoot-totales { background-color: #f8fafc !important; border-top: 2px solid #94a3b8 !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div id="pantallaLogin" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50 p-4">
        <div class="w-full max-w-md text-center space-y-6">
            <div class="space-y-2">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 uppercase">BARRIO PRIVADO EUSKADI I</h1>
                <p class="text-sm font-semibold tracking-wider text-slate-500 uppercase">SISTEMAS DE EXPENSAS COMUNES</p>
            </div>
            
            <form onsubmit="ejecutarAutenticacion(event)" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-left space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tipo de Usuario</label>
                    <select id="loginUsuario" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-slate-900">
                        <option value="propietario">Propietario</option>
                        <option value="administrador">Administrador</option>
                        <option value="map">MAP</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Clave de Acceso</label>
                    <input id="loginClave" type="password" placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" required>
                </div>
                <div id="loginError" class="text-xs font-bold text-rose-600 hidden text-center pt-1">
                    Clave incorrecta. Intente nuevamente.
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm py-2.5 rounded-lg transition shadow-sm cursor-pointer">
                    Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>

    <div id="entornoDashboard" class="hidden">
        <header class="bg-slate-950 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold tracking-tight uppercase">BARRIO EUSKADI I - POCITO</h1>
                    <p class="text-xs text-slate-400">Panel de Control Financiero y Gestión de Expensas en Tiempo Real</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="cerrarSesion()" class="no-print flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 transition cursor-pointer">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Salir
                    </button>
                    <button onclick="window.print()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-4 py-2 rounded-lg border border-slate-700 transition shadow-sm cursor-pointer">
                        <i data-lucide="printer" class="w-4 h-4 text-emerald-400"></i> Imprimir Reporte / PDF
                    </button>
                    <div id="statusConnection" class="flex items-center gap-2 text-sm bg-slate-900 px-3 py-1.5 rounded-full text-slate-300">
                        <span class="w-2.5 h-2.5 bg-amber-500 rounded-full animate-pulse" id="statusDot"></span>
                        <span id="statusText">Conectando...</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

            <section id="seccionFiltrosSuperiores" class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-5 no-print">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Filtrar por Estado</label>
                        <select id="filterEstado" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" disabled>
                            <option value="TODOS">Todos los Estados</option>
                            <option value="PENDIENTE">Pendientes</option>
                            <option value="PAGADO">Pagados</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Buscar por Propietario</label>
                        <div class="relative">
                            <input id="searchQuery" type="text" placeholder="Buscar nombre..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 pl-8 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" disabled>
                            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-3"></i>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1 flex justify-between">
                            <span>Filtrar por Período / Mes</span>
                        </label>
                        <select id="filterMeses" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" disabled>
                            <option value="TODOS">Todos los meses</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Selección de Fichas por Lote</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-10 gap-2 text-center" id="contenedorLotesBotonera">
                        <button id="btnLote-01" onclick="alternarSeleccionLote('01')" class="bg-white hover:bg-slate-100 text-slate-800 p-2 rounded-xl border border-slate-200 transition-all cursor-pointer flex flex-col items-center justify-center shadow-xs min-h-[65px]" disabled><span class="text-xs font-bold text-slate-400">Lote 01</span><span id="lblPropietario-01" class="text-[10px] font-semibold text-slate-700 truncate w-full mt-0.5 uppercase tracking-tight">...</span></button>
                        <button id="btnLote-02" onclick="alternarSeleccionLote('02')" class="bg-white hover:bg-slate-100 text-slate-800 p-2 rounded-xl border border-slate-200 transition-all cursor-pointer flex flex-col items-center justify-center shadow-xs min-h-[65px]" disabled><span class="text-xs font-bold text-slate-400">Lote
